[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "angio-cls"
version = "1.0.0"
description = "Coronary lesion classification in invasive coronary angiography with patient-level evaluation"
authors = [{ name = "Marwa Saighi" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "pandas",
    "scikit-learn",
    "pillow",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
